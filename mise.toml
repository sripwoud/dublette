[tasks.build]
alias = "b"
run = "cargo build --release"
silent = true

[tasks.dublette]
alias = "d"
depends = "build"
description = "Run dublette"
raw = true
run = "{{ vars.dublette }}"
silent = true

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tools]
"cargo:cargo-nextest" = "0.9.143"
"cargo:convco" = "0.7.1"
"aqua:dprint/dprint" = "0.57.0"
hk = "1.57.0"
pkl = "0.32.1"
rust = "1.98.0"

[vars]
dublette = "target/release/dublette"
